---
- name: Reboot-guard daemon-reload
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reboot-guard daemon-reexec
  ansible.builtin.systemd_service:
    daemon_reexec: true

- name: Reboot-guard restorecon banners
  ansible.builtin.shell: for f in /etc/issue /etc/issue.net /etc/motd; do [ -e "$f" ] && restorecon "$f"; done; exit 0
  changed_when: false
